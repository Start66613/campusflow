    :root { --pearl:#F4F3FA; --violet:#655CE8; --ink:#202033; }

    .brand-word { font-family:"Segoe UI",sans-serif; font-size:96px; line-height:1.06; font-weight:600; letter-spacing:-3px; position:relative; z-index:2; }
    .brand-note { display:block; font-size:26px; line-height:1.4; letter-spacing:3px; margin-top:15px; color:#4E487B; font-weight:500; }
    .droplets { position:absolute; inset:0; z-index:4; display:flex; justify-content:center; align-items:center; pointer-events:none; }
    .drop { position:absolute; width:256px; height:256px; border-radius:50%; background:radial-gradient(circle at 30% 18%,rgba(255,255,255,.98) 0%,rgba(217,213,255,.82) 15%,rgba(122,110,239,.8) 43%,rgba(101,92,232,.88) 65%,rgba(87,75,167,.45) 84%,rgba(255,255,255,.7) 100%); border:2px solid rgba(255,255,255,.8); box-shadow:inset 9px 11px 14px rgba(255,255,255,.64),inset -6px -15px 24px rgba(46,23,124,.21),0 25px 35px rgba(76,57,140,.19),0 2px 6px rgba(51,44,120,.22); }

    .drop:after { content:""; position:absolute; inset:7px; border:1px solid rgba(255,255,255,.5); border-radius:50%; }
    #drop-left { margin-left:-370px; width:178px; height:178px; }
    #drop-right { margin-left:480px; width:124px; height:124px; }
    .caustic { position:absolute; width:740px; height:76px; border-radius:50%; background:radial-gradient(ellipse,rgba(129,111,227,.27),rgba(160,143,232,.12) 42%,rgba(255,255,255,0) 70%); filter:blur(12px); bottom:14px; left:calc(50% - 370px); z-index:1; }
    .heading { width:100%; display:flex; flex-direction:column; gap:25px; align-items:flex-start; }
    h1 { font-size:99px; line-height:1.23; font-weight:700; letter-spacing:0; white-space:nowrap; }
    .subline { font-size:35px; line-height:1.4; font-weight:400; color:#56516F; }
    .shine { position:absolute; width:120px; height:250px; top:5px; left:0; border-radius:60px; background:linear-gradient(100deg,transparent,rgba(255,255,255,.62),transparent); filter:blur(8px); transform:skewX(-24deg); pointer-events:none; }
    .glow { position:absolute; width:1000px; height:750px; left:calc(50% - 500px); top:20px; border-radius:50%; background:radial-gradient(ellipse,rgba(133,112,245,.13),rgba(175,162,239,.05) 42%,transparent 70%); filter:blur(38px); z-index:0; }
    .topline { position:absolute; left:128px; right:128px; top:144px; height:1px; background:rgba(101,92,232,.15); z-index:1; transform-origin:left center; }
