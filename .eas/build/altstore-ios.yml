build:
  name: CampusFlow AltStore unsigned iOS build
  steps:
    - eas/checkout
    - eas/install_node_modules
    - eas/prebuild
    - run:
        name: Install CocoaPods dependencies
        working_directory: ./ios
        command: pod install
    - run:
        name: Build unsigned iPhone app for AltStore
        command: |
          set -euo pipefail

          WORKSPACE_PATH="$(find ios -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)"
          if [ -z "$WORKSPACE_PATH" ]; then
            echo "No Xcode workspace was generated."
            exit 1
          fi

          SCHEME_NAME="$(basename "$WORKSPACE_PATH" .xcworkspace)"
          rm -rf ios/derived-data unsigned-ipa CampusFlow-AltStore.ipa

          xcodebuild \
            -workspace "$WORKSPACE_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/derived-data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

          APP_PATH="$(find ios/derived-data/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "Unsigned iPhone app was not produced."
            exit 1
          fi

          mkdir -p unsigned-ipa/Payload
          ditto "$APP_PATH" "unsigned-ipa/Payload/$(basename "$APP_PATH")"
          ditto -c -k --sequesterRsrc --keepParent unsigned-ipa/Payload CampusFlow-AltStore.ipa
    - eas/upload_artifact:
        name: CampusFlow AltStore IPA
        inputs:
          type: application-archive
          path: CampusFlow-AltStore.ipa
